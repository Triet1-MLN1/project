<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="redGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="goldStarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- Radiant Golden Star Center Top (Tối thượng / Làm Chủ) -->
  <g transform="translate(400, 110)" filter="url(#glow3)">
    <circle cx="0" cy="0" r="85" fill="#eab308" opacity="0.15"/>
    <polygon points="0,-60 18,-18 60,-18 25,9 38,52 0,25 -38,52 -25,9 -60,-18 -18,-18" fill="url(#goldStarGrad)"/>
  </g>

  <!-- Solidary People / Hands Clustered Together (Đại đoàn kết toàn dân) -->
  <g transform="translate(400, 265)">
    <!-- Center Hero Figure -->
    <g transform="translate(0, 0)">
      <circle cx="0" cy="-45" r="24" fill="#f8fafc"/>
      <path d="M-40,40 C-40,-15 40,-15 40,40 Z" fill="#3b82f6"/>
      <!-- Slogan Badge -->
      <circle cx="0" cy="5" r="9" fill="url(#goldStarGrad)"/>
    </g>

    <!-- Left Figure 1: Công nhân -->
    <g transform="translate(-80, 15)">
      <circle cx="0" cy="-40" r="20" fill="#e2e8f0"/>
      <!-- Helmet / Hat -->
      <path d="M-22,-45 C-22,-60 22,-60 22,-45 Z" fill="#f59e0b"/>
      <path d="M-35,35 C-35,-10 35,-10 35,35 Z" fill="#0284c7"/>
    </g>

    <!-- Right Figure 1: Nông dân / Trí thức -->
    <g transform="translate(80, 15)">
      <circle cx="0" cy="-40" r="20" fill="#e2e8f0"/>
      <!-- Conical Hat Nón lá outline -->
      <polygon points="0,-68 -28,-42 28,-42" fill="#d97706" opacity="0.9"/>
      <path d="M-35,35 C-35,-10 35,-10 35,35 Z" fill="#10b981"/>
    </g>

    <!-- Left Figure 2: Phụ nữ / Thanh niên -->
    <g transform="translate(-160, 30)">
      <circle cx="0" cy="-35" r="18" fill="#cbd5e1"/>
      <path d="M-30,30 C-30,-8 30,-8 30,30 Z" fill="#ec4899"/>
    </g>

    <!-- Right Figure 2: Bộ đội / Chiến sĩ -->
    <g transform="translate(160, 30)">
      <circle cx="0" cy="-35" r="18" fill="#cbd5e1"/>
      <!-- Cap -->
      <ellipse cx="0" cy="-45" rx="20" ry="8" fill="#15803d"/>
      <path d="M-30,30 C-30,-8 30,-8 30,30 Z" fill="#16a34a"/>
    </g>

    <!-- Interlinked Golden Arc (Biểu trưng khối liên minh vững chắc) -->
    <path d="M-220,50 Q0,10 220,50" fill="none" stroke="url(#goldStarGrad)" stroke-width="6" stroke-linecap="round" filter="url(#glow3)"/>
  </g>

  <!-- Crown of Supreme Position Icon (Địa vị cao nhất) -->
  <g transform="translate(400, 205)">
    <polygon points="-30,-10 -20,15 20,15 30,-10 12,0 0,-18 -12,0" fill="url(#goldStarGrad)"/>
  </g>

  <!-- Caption overlay badge -->
  <rect x="230" y="395" width="340" height="36" rx="18" fill="#0f172a" fill-opacity="0.9" stroke="url(#goldStarGrad)" stroke-width="1.5"/>
  <text x="400" y="419" fill="#fde047" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    👑 ĐỊA VỊ CAO NHẤT LÀ...
  </text>
</svg>
