<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#021c15"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="goldGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="redRubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="glow4" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad4)"/>

  <!-- Halo Aura -->
  <circle cx="400" cy="190" r="170" fill="#10b981" opacity="0.15" filter="url(#glow4)"/>

  <!-- Center: Inspiring New Socialist Human Avatar (Vươn mình vươn tới tương lai) -->
  <g transform="translate(400, 230)">
    <!-- Body & Open Arms (Biểu tượng khát vọng cống hiến) -->
    <path d="M-60,110 C-60,30 -20,-10 0,-10 C20,-10 60,30 60,110 Z" fill="url(#emeraldGrad)"/>
    <!-- Head with Bright Mind -->
    <circle cx="0" cy="-60" r="32" fill="#f8fafc"/>
    <circle cx="0" cy="-60" r="28" fill="#fef08a" opacity="0.4"/>

    <!-- Left Arm Lifting "ĐỨC" (Đạo đức cách mạng - Ngôi sao đỏ / Trái tim đỏ) -->
    <g transform="translate(-130, -50)">
      <path d="M70,50 Q-20,30 -60,-20" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="-60" cy="-30" r="38" fill="#1e293b" stroke="url(#redRubyGrad)" stroke-width="3" filter="url(#glow4)"/>
      <text x="-60" y="-23" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" text-anchor="middle">ĐỨC</text>
      <circle cx="-60" cy="-60" r="6" fill="url(#redRubyGrad)"/>
    </g>

    <!-- Right Arm Lifting "TÀI" (Khoa học, Chuyên môn - Bánh răng / Nguyên tử) -->
    <g transform="translate(130, -50)">
      <path d="M-70,50 Q20,30 60,-20" fill="none" stroke="url(#emeraldGrad)" stroke-width="14" stroke-linecap="round"/>
      <circle cx="60" cy="-30" r="38" fill="#1e293b" stroke="url(#goldGrad4)" stroke-width="3" filter="url(#glow4)"/>
      <text x="60" y="-23" fill="#facc15" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="900" text-anchor="middle">TÀI</text>
      <circle cx="60" cy="-60" r="6" fill="url(#goldGrad4)"/>
    </g>

    <!-- Golden Star of Ideology on Chest -->
    <polygon points="0,20 6,32 19,34 10,43 12,56 0,50 -12,56 -10,43 -19,34 -6,32" fill="url(#goldGrad4)" filter="url(#glow4)"/>
  </g>

  <!-- Dual Badges "VỪA HỒNG" - "VỪA CHUYÊN" -->
  <g transform="translate(240, 360)">
    <rect x="-65" y="-16" width="130" height="32" rx="16" fill="url(#redRubyGrad)" opacity="0.9"/>
    <text x="0" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">VỪA HỒNG (Đức)</text>
  </g>
  <g transform="translate(560, 360)">
    <rect x="-70" y="-16" width="140" height="32" rx="16" fill="#0284c7" opacity="0.9"/>
    <text x="0" y="6" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">VỪA CHUYÊN (Tài)</text>
  </g>

  <!-- Caption overlay badge -->
  <rect x="220" y="395" width="360" height="36" rx="18" fill="#022c22" fill-opacity="0.9" stroke="url(#emeraldGrad)" stroke-width="1.5"/>
  <text x="400" y="419" fill="#a7f3d0" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    🌟 NHÂN TỐ TRUNG TÂM &amp; ĐỘNG LỰC CỐT LÕI
  </text>
</svg>
