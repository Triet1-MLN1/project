<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="buildGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="goldGrad5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad5)"/>

  <!-- Left: XÂY DỰNG (Công trình, Đặt gạch, Ươm mầm tương lai) -->
  <g transform="translate(250, 210)">
    <circle cx="0" cy="10" r="120" fill="#0284c7" opacity="0.12" filter="url(#glow5)"/>
    <!-- Building Bricks / Modern Architecture -->
    <!-- Tower Block 1 -->
    <rect x="-80" y="-30" width="45" height="110" rx="4" fill="url(#buildGrad)"/>
    <!-- Windows -->
    <rect x="-70" y="-15" width="10" height="15" fill="#bae6fd"/>
    <rect x="-55" y="-15" width="10" height="15" fill="#bae6fd"/>
    <rect x="-70" y="15" width="10" height="15" fill="#bae6fd"/>
    <rect x="-55" y="15" width="10" height="15" fill="#bae6fd"/>
    <rect x="-70" y="45" width="10" height="15" fill="#bae6fd"/>
    <rect x="-55" y="45" width="10" height="15" fill="#bae6fd"/>

    <!-- Tower Block 2 -->
    <rect x="-25" y="-70" width="55" height="150" rx="4" fill="#38bdf8"/>
    <!-- Windows -->
    <rect x="-15" y="-55" width="12" height="18" fill="#ffffff"/>
    <rect x="5" y="-55" width="12" height="18" fill="#ffffff"/>
    <rect x="-15" y="-20" width="12" height="18" fill="#ffffff"/>
    <rect x="5" y="-20" width="12" height="18" fill="#ffffff"/>
    <rect x="-15" y="15" width="12" height="18" fill="#ffffff"/>
    <rect x="5" y="15" width="12" height="18" fill="#ffffff"/>
    <rect x="-15" y="50" width="12" height="18" fill="#ffffff"/>
    <rect x="5" y="50" width="12" height="18" fill="#ffffff"/>

    <!-- Construction Crane on Top -->
    <path d="M5,-70 L5,-105 L65,-105" fill="none" stroke="#facc15" stroke-width="4"/>
    <line x1="5" y1="-85" x2="35" y2="-105" stroke="#facc15" stroke-width="2"/>
    <line x1="50" y1="-105" x2="50" y2="-80" stroke="#f8fafc" stroke-width="2" stroke-dasharray="3,3"/>

    <!-- Badge Left: "XÂY" -->
    <rect x="-70" y="105" width="140" height="34" rx="17" fill="#0284c7"/>
    <text x="0" y="128" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      🏗️ XÂY DỰNG
    </text>
  </g>

  <!-- Center Symbol: "ĐI ĐÔI VỚI" (& / +) -->
  <g transform="translate(400, 220)" filter="url(#glow5)">
    <circle cx="0" cy="0" r="32" fill="#1e1b4b" stroke="url(#goldGrad5)" stroke-width="3"/>
    <text x="0" y="9" fill="url(#goldGrad5)" font-family="'Segoe UI', sans-serif" font-size="24" font-weight="900" text-anchor="middle">⇄</text>
  </g>

  <!-- Right: CHỐNG (Tấm Khiên Bảo Vệ & Thanh Gươm Trừng Trị Tiêu Cực) -->
  <g transform="translate(550, 210)">
    <circle cx="0" cy="10" r="120" fill="#ef4444" opacity="0.12" filter="url(#glow5)"/>

    <!-- Guardian Shield -->
    <path d="M-65,-60 Q0,-75 65,-60 C65,30 20,80 0,95 C-20,80 -65,30 -65,-60 Z" fill="url(#shieldGrad)" stroke="#fecaca" stroke-width="4" filter="url(#glow5)"/>
    <path d="M-45,-45 Q0,-55 45,-45 C45,20 15,60 0,72 C-15,60 -45,20 -45,-45 Z" fill="#7f1d1d"/>

    <!-- Sword intersecting Shield -->
    <g transform="translate(0, 10)">
      <!-- Blade -->
      <polygon points="0,-85 -7,-70 -6,25 0,40 6,25 7,-70" fill="#f8fafc"/>
      <!-- Crossguard -->
      <rect x="-24" y="-72" width="48" height="8" rx="3" fill="url(#goldGrad5)"/>
      <!-- Grip & Pommel -->
      <rect x="-4" y="-95" width="8" height="23" rx="2" fill="#92400e"/>
      <circle cx="0" cy="-97" r="7" fill="url(#goldGrad5)"/>
    </g>

    <!-- Badge Right: "CHỐNG" -->
    <rect x="-70" y="105" width="140" height="34" rx="17" fill="#dc2626"/>
    <text x="0" y="128" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="900" text-anchor="middle">
      🛡️ BẢO VỆ / CHỐNG
    </text>
  </g>

  <!-- Caption overlay badge -->
  <rect x="230" y="395" width="340" height="36" rx="18" fill="#1e1b4b" fill-opacity="0.9" stroke="url(#goldGrad5)" stroke-width="1.5"/>
  <text x="400" y="419" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ⚖️ PHƯƠNG CHÂM XUYÊN SUỐT
  </text>
</svg>
