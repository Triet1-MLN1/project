<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="oceanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="45%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  <circle cx="400" cy="200" r="280" fill="url(#glow)"/>

  <!-- Ocean Waves (Abstract) -->
  <path d="M0,360 C150,330 250,390 400,350 C550,310 680,380 800,340 L800,450 L0,450 Z" fill="url(#oceanGrad)"/>
  <path d="M0,380 C180,350 300,410 480,370 C620,330 720,400 800,370 L800,450 L0,450 Z" fill="#0c4a6e" opacity="0.6"/>

  <!-- Guiding Compass Star (Sun/Star on horizon) -->
  <g transform="translate(400, 80)" filter="url(#dropGlow)">
    <polygon points="0,-45 12,-12 45,0 12,12 0,45 -12,12 -45,0 -12,-12" fill="url(#goldGrad)"/>
    <circle cx="0" cy="0" r="7" fill="#fff"/>
  </g>

  <!-- Ship Helm Wheel (Vô Lăng / Bánh Lái Tàu) -->
  <g transform="translate(400, 240)">
    <!-- Wheel Outer Rim -->
    <circle cx="0" cy="0" r="105" fill="none" stroke="url(#goldGrad)" stroke-width="14"/>
    <circle cx="0" cy="0" r="78" fill="none" stroke="url(#goldGrad)" stroke-width="8"/>
    
    <!-- Spokes & Handles (8 spokes) -->
    <!-- Handles (Spoke ends extending outside) -->
    <g stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round">
      <!-- 0 deg -->
      <line x1="0" y1="-78" x2="0" y2="-135"/>
      <circle cx="0" cy="-140" r="7" fill="url(#goldGrad)"/>
      <!-- 45 deg -->
      <line x1="55" y1="-55" x2="95" y2="-95"/>
      <circle cx="99" cy="-99" r="7" fill="url(#goldGrad)"/>
      <!-- 90 deg -->
      <line x1="78" y1="0" x2="135" y2="0"/>
      <circle cx="140" cy="0" r="7" fill="url(#goldGrad)"/>
      <!-- 135 deg -->
      <line x1="55" y1="55" x2="95" y2="95"/>
      <circle cx="99" cy="99" r="7" fill="url(#goldGrad)"/>
      <!-- 180 deg -->
      <line x1="0" y1="78" x2="0" y2="135"/>
      <circle cx="0" cy="140" r="7" fill="url(#goldGrad)"/>
      <!-- 225 deg -->
      <line x1="-55" y1="55" x2="-95" y2="95"/>
      <circle cx="-99" cy="99" r="7" fill="url(#goldGrad)"/>
      <!-- 270 deg -->
      <line x1="-78" y1="0" x2="-135" y2="0"/>
      <circle cx="-140" cy="0" r="7" fill="url(#goldGrad)"/>
      <!-- 315 deg -->
      <line x1="-55" y1="-55" x2="-95" y2="-95"/>
      <circle cx="-99" cy="-99" r="7" fill="url(#goldGrad)"/>
    </g>

    <!-- Center Hub -->
    <circle cx="0" cy="0" r="32" fill="#1e293b" stroke="url(#goldGrad)" stroke-width="6"/>
    <circle cx="0" cy="0" r="14" fill="url(#goldGrad)"/>
  </g>

  <!-- Golden Hands Holding the Wheel (Biểu tượng người cầm lái) -->
  <g opacity="0.95" filter="url(#dropGlow)">
    <!-- Left Hand -->
    <path d="M260,250 C280,240 295,245 305,255 C310,260 305,275 285,285 C265,295 240,290 230,270 Z" fill="url(#goldGrad)"/>
    <!-- Right Hand -->
    <path d="M540,250 C520,240 505,245 495,255 C490,260 495,275 515,285 C535,295 560,290 570,270 Z" fill="url(#goldGrad)"/>
  </g>

  <!-- Caption overlay badge -->
  <rect x="250" y="395" width="300" height="36" rx="18" fill="#1e293b" fill-opacity="0.85" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <text x="400" y="419" fill="#fef3c7" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    ⚓ NGƯỜI CHÈO LÁI CON THUYỀN
  </text>
</svg>
