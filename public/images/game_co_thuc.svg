<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="50%" stop-color="#292524"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="riceBowlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="50%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#9a3412"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Glowing Aura -->
  <circle cx="280" cy="220" r="180" fill="#ea580c" opacity="0.15" filter="url(#glow2)"/>
  <circle cx="520" cy="220" r="180" fill="#0284c7" opacity="0.15" filter="url(#glow2)"/>

  <!-- Left: BÁT CƠM ĐẦY (Cơ sở kinh tế / "THỰC") -->
  <g transform="translate(260, 220)">
    <!-- Rice Steam Particles -->
    <path d="M-30,-70 C-40,-100 -20,-120 -30,-140" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" opacity="0.6"/>
    <path d="M0,-75 C-10,-105 10,-125 0,-150" fill="none" stroke="#fed7aa" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
    <path d="M30,-70 C20,-100 40,-120 30,-140" fill="none" stroke="#fed7aa" stroke-width="4" stroke-linecap="round" opacity="0.6"/>

    <!-- Steaming Hot Rice Mound -->
    <ellipse cx="0" cy="-20" rx="95" ry="50" fill="#f8fafc"/>
    <path d="M-90,-20 Q0,-80 90,-20 Z" fill="#ffffff" filter="url(#glow2)"/>
    <circle cx="-35" cy="-35" r="5" fill="#f1f5f9"/>
    <circle cx="25" cy="-45" r="6" fill="#f1f5f9"/>
    <circle cx="0" cy="-30" r="7" fill="#f1f5f9"/>

    <!-- Ceramic Bowl (Bát sứ) -->
    <path d="M-105,-15 Q-115,75 0,95 Q115,75 105,-15 Z" fill="url(#riceBowlGrad)" stroke="#fdba74" stroke-width="4"/>
    <ellipse cx="0" cy="-15" rx="105" ry="25" fill="none" stroke="#fdba74" stroke-width="4"/>
    <!-- Bowl Foot -->
    <path d="M-40,90 L-45,108 L45,108 L40,90 Z" fill="#7c2d12"/>

    <!-- Badge under Left -->
    <rect x="-80" y="125" width="160" height="34" rx="17" fill="#ea580c" opacity="0.9"/>
    <text x="0" y="148" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      Kinh Tế (CÓ THỰC)
    </text>
  </g>

  <!-- Middle Arrow / Link -->
  <g transform="translate(400, 220)" filter="url(#glow2)">
    <circle cx="0" cy="0" r="30" fill="#292524" stroke="url(#goldGrad2)" stroke-width="3"/>
    <text x="0" y="9" fill="url(#goldGrad2)" font-family="'Segoe UI', sans-serif" font-size="26" font-weight="black" text-anchor="middle">➔</text>
  </g>

  <!-- Right: CUỐN SÁCH & ĐẠO LÝ (Văn hóa, Đạo đức / "ĐẠO") -->
  <g transform="translate(540, 220)">
    <!-- Aura behind book -->
    <circle cx="0" cy="15" r="75" fill="#38bdf8" opacity="0.2"/>

    <!-- Open Book / Scroll -->
    <!-- Left Page -->
    <path d="M-10,65 C-45,65 -80,50 -95,20 L-95,-55 C-80,-25 -45,-10 -10,-10 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
    <!-- Right Page -->
    <path d="M10,65 C45,65 80,50 95,20 L95,-55 C80,-25 45,-10 10,-10 Z" fill="#f8fafc" stroke="#38bdf8" stroke-width="3"/>
    <!-- Book Spine -->
    <path d="M-12,70 L0,78 L12,70 L12,-5 L0,-12 L-12,-5 Z" fill="#0284c7"/>

    <!-- Lines of Wisdom on Pages -->
    <line x1="-80" y1="-20" x2="-25" y2="-5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="5" x2="-25" y2="20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="-80" y1="30" x2="-25" y2="45" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <line x1="25" y1="-5" x2="80" y2="-20" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="20" x2="80" y2="5" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>
    <line x1="25" y1="45" x2="80" y2="30" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/>

    <!-- Glowing Star of Knowledge above Book -->
    <polygon points="0,-60 5,-45 20,-40 5,-35 0,-20 -5,-35 -20,-40 -5,-45" fill="url(#goldGrad2)"/>

    <!-- Badge under Right -->
    <rect x="-80" y="125" width="160" height="34" rx="17" fill="#0284c7" opacity="0.9"/>
    <text x="0" y="148" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">
      Văn Hóa (VỰC ĐẠO)
    </text>
  </g>

  <!-- Caption overlay badge -->
  <rect x="230" y="395" width="340" height="36" rx="18" fill="#1c1917" fill-opacity="0.9" stroke="url(#goldGrad2)" stroke-width="1.5"/>
  <text x="400" y="419" fill="#fef08a" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="1">
    🌾 CÂU TỤC NGỮ VỀ TIỀN ĐỀ KINH TẾ
  </text>
</svg>
